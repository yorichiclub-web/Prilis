name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Aplicar patch
        run: git apply prism-novos-players.patch
      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - uses: actions/upload-artifact@v4
        with:
          name: prism-debug-apk
          path: app/build/outputs/apk/debug/*.apk
